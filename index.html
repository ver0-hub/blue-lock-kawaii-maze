<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blue Lock Kawaii Maze - Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffd9ec;font-family:Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
background:linear-gradient(145deg,#ffd9ec,#fff1f8)}
.card{width:min(92vw,520px);padding:28px 22px;border-radius:28px;background:#fff;
box-shadow:0 18px 60px #b25b8a55;text-align:center;border:4px solid #ff87bd}
h1{margin:0 0 8px;font-size:clamp(28px,8vw,48px);color:#222}
p{color:#65445a;font-weight:700;line-height:1.4}
button{border:0;border-radius:999px;padding:17px 42px;font-size:22px;font-weight:900;background:#ff4f9d;color:white;
box-shadow:0 8px 0 #c92f75;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 4px 0 #c92f75}
#ok{display:none;margin-top:20px;padding:18px;border-radius:18px;background:#eaffef;color:#146b32;font-weight:900}
#error{position:fixed;left:10px;right:10px;bottom:10px;background:#8b0000;color:#fff;padding:10px;border-radius:10px;display:none;z-index:9999}
</style>
</head>
<body>
<div id="screen"><div class="card">
<div style="font-size:52px">⚽💗</div>
<h1>BLUE LOCK<br>KAWAII MAZE</h1>
<p>Prueba de compatibilidad para iPhone, Android y PC.</p>
<button id="play" type="button">JUGAR</button>
<div id="ok">✅ ¡FUNCIONA!<br><small>El navegador está ejecutando correctamente el juego.</small></div>
</div></div>
<div id="error"></div>
<script>
(function(){
"use strict";
var play=document.getElementById("play");
var ok=document.getElementById("ok");
var err=document.getElementById("error");
function start(e){
 if(e){e.preventDefault();}
 play.style.display="none";
 ok.style.display="block";
 document.body.style.background="#ffd0e8";
}
play.addEventListener("click",start,false);
play.addEventListener("touchend",start,{passive:false});
window.addEventListener("error",function(e){
 err.style.display="block";
 err.textContent="ERROR JS: "+(e.message||"desconocido");
});
})();
</script>
</body></html>
